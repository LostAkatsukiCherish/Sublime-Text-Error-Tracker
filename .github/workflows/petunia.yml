name: "DAMSON"
run-name: "Wisteria"
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: "Magnolia-${{ github.workflow }}"
  cancel-in-progress: true
jobs:
  Sunflower:
    permissions:
      contents: read
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.island.outputs.page_url }}
    steps:
      - name: "flint"
        uses: actions/checkout@v6
      - name: "SNAPDRAGON"
        uses: actions/configure-pages@v6
      - name: "SPRING"
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}
      - name: "highland"
        id: island
        uses: actions/deploy-pages@v5
